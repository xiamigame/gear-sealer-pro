plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

evaluationDependsOn(':common')

def modId = rootProject.findProperty('mod_id')
def modVersion = rootProject.findProperty('mod_version')
def modAuthors = rootProject.findProperty('mod_authors')

group = rootProject.findProperty('mod_group_id')
version = modVersion

base {
    archivesName = "${modId}-${minecraft_version}"
}

// Mojang ships Java 17 to end users in 1.18+, so this adapter targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', modId

            mods {
                "${modId}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // The Vault (Vault Hunters 3rd Edition) is provided by the modpack at runtime.
    // It is compiled against only and never bundled into this mod's jar.
    // Obtain the jar from the target instance: mods/the_vault-<mc>-<version>.jar
    compileOnly files("${rootDir}/libs/the_vault-1.18.2-3.21.6.6884.jar")

    implementation project(':common')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : modId,
            mod_name               : rootProject.findProperty('mod_name'),
            mod_license            : rootProject.findProperty('mod_license'),
            mod_version            : modVersion,
            mod_authors            : modAuthors,
            mod_description        : rootProject.findProperty('mod_description'),
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    // Single jar: embed the pure-JVM common classes, then reobfuscate the whole artifact.
    from(project(':common').sourceSets.main.output)

    manifest {
        attributes([
                'Specification-Title'     : modId,
                'Specification-Vendor'    : modAuthors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : modAuthors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}
