// Aggregated build for the Gear Sealer Pro repository.
//
//   common              pure JVM (ports, selection state, layout, cost view) + tests
//   adapter/1_18_2      the only module that touches the Forge/Minecraft MDK
//
// The adapter jar is a single jar: it embeds the common module's classes.
// Build the released artifact with:
//   .\gradlew.bat :adapter:1_18_2:build --no-daemon

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
